<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nexora Verify</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  height:100vh;
  overflow:hidden;
  font-family:'Poppins',sans-serif;
  background:#02040f;
  display:flex;
  justify-content:center;
  align-items:center;
  position:relative;
}

body::before{
  content:"";
  position:absolute;
  width:1200px;
  height:1200px;
  background: radial-gradient(circle, rgba(0,174,255,0.15) 0%, transparent 60%);
  animation:pulse 6s infinite ease-in-out;
}

body::after{
  content:"";
  position:absolute;
  inset:0;
  background:
  radial-gradient(circle at 20% 70%, rgba(170,0,255,0.25), transparent 25%),
  radial-gradient(circle at 80% 30%, rgba(0,140,255,0.25), transparent 25%);
  filter:blur(60px);
}

@keyframes pulse{
  0%{transform:scale(1);}
  50%{transform:scale(1.1);}
  100%{transform:scale(1);}
}

.verify-box{
  width:450px;
  padding:45px;
  border-radius:28px;
  background:rgba(7,10,25,0.65);
  backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,0.08);
  text-align:center;
  z-index:2;
  position:relative;
  box-shadow:0 0 40px rgba(0,174,255,0.2);
}

h1{
  color:white;
  font-size:42px;
}

.subtitle{
  color:#aaa;
  margin-bottom:20px;
}

.verify-btn{
  width:100%;
  padding:18px;
  border:none;
  border-radius:18px;
  font-size:18px;
  font-weight:600;
  cursor:pointer;
  color:white;
  background:linear-gradient(90deg,#7b2cff,#00c3ff);
  margin-top:10px;
}

.verify-btn:disabled{
  opacity:0.5;
  cursor:not-allowed;
}

.ready{
  color:#00ff99;
  margin:15px 0;
  display:none;
}

.user{
  color:#fff;
  margin-bottom:15px;
}

.error{
  color:red;
  margin-top:10px;
  display:none;
}

</style>
</head>

<body>

<div class="verify-box">

  <h1>NEXORA</h1>

  <p class="subtitle">Discord Verification System</p>

  <div id="user" class="user"></div>

  <div id="ready" class="ready">✔ Connected to Discord</div>

  <div id="error" class="error">❌ User introuvable</div>

  <button id="loginBtn" class="verify-btn" onclick="login()">
    Verify Identity
  </button>

  <button id="finalBtn" class="verify-btn" style="display:none;" onclick="verifyRole()">
    Confirm Verification
  </button>

</div>

<script>

const params = new URLSearchParams(window.location.search);
const userId = params.get("user");

const loginBtn = document.getElementById("loginBtn");
const finalBtn = document.getElementById("finalBtn");
const ready = document.getElementById("ready");
const userBox = document.getElementById("user");
const errorBox = document.getElementById("error");

if(userId && userId !== "null"){
  ready.style.display = "block";
  loginBtn.style.display = "none";
  finalBtn.style.display = "block";
  userBox.innerText = "User ID: " + userId;
} else {
  errorBox.style.display = "block";
  finalBtn.disabled = true;
}

function login(){
  window.location.href="/auth/discord";
}

async function verifyRole(){

  try {

    finalBtn.disabled = true;
    finalBtn.innerText = "Verification...";

    const res = await fetch("/api/verify", {
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ userId })
    });

    const text = await res.text();

    alert(text);

    finalBtn.innerText = "Verified ✔";

  } catch (err) {

    alert("Erreur verification");
    console.log(err);

  }

}

</script>

</body>
</html>
