<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Secure Access</title>

<style>

body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:Arial;
  background:#0b0f19;
  overflow:hidden;
  color:white;
}

/* gradient animé */
.bg{
  position:absolute;
  width:600px;
  height:600px;
  background:linear-gradient(45deg,#5865F2,#00d4ff,#7c3aed);
  filter:blur(180px);
  border-radius:50%;
  animation:move 10s infinite alternate;
}

@keyframes move{
  from{transform:translate(-250px,-200px);}
  to{transform:translate(250px,200px);}
}

/* card */
.card{
  position:relative;
  z-index:2;
  width:420px;
  padding:35px;
  border-radius:18px;
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.08);
  backdrop-filter:blur(18px);
  text-align:center;
  box-shadow:0 0 40px rgba(0,0,0,0.5);
  animation:fade 1s ease;
}

@keyframes fade{
  from{opacity:0; transform:translateY(30px);}
  to{opacity:1; transform:translateY(0);}
}

h1{
  font-size:26px;
  margin-bottom:8px;
}

p{
  color:#b5b5b5;
  margin-bottom:25px;
}

/* bouton premium */
button{
  background:linear-gradient(90deg,#5865F2,#7c3aed);
  border:none;
  padding:14px 40px;
  color:white;
  font-size:16px;
  border-radius:12px;
  cursor:pointer;
  transition:0.3s;
  box-shadow:0 0 25px rgba(88,101,242,0.6);
}

button:hover{
  transform:scale(1.08);
  box-shadow:0 0 45px rgba(124,58,237,0.8);
}

/* status */
#msg{
  margin-top:20px;
  font-size:14px;
  color:#57F287;
}

/* loader */
.loader{
  margin-top:20px;
  display:none;
}

.dot{
  width:8px;
  height:8px;
  background:#5865F2;
  border-radius:50%;
  display:inline-block;
  margin:0 3px;
  animation:bounce 1s infinite;
}

.dot:nth-child(2){animation-delay:0.2s;}
.dot:nth-child(3){animation-delay:0.4s;}

@keyframes bounce{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-10px);}
}

</style>

</head>

<body>

<div class="bg"></div>

<div class="card">

<h1>Secure Verification</h1>

<p>Accès protégé — vérification requise</p>

<button id="btn">Verify Identity</button>

<div class="loader" id="loader">
  <div class="dot"></div>
  <div class="dot"></div>
  <div class="dot"></div>
</div>

<div id="msg"></div>

</div>

<script>

document.getElementById("btn").onclick = async () => {

  document.getElementById("loader").style.display = "block";

  const res = await fetch("/finalverify");
  const text = await res.text();

  document.getElementById("msg").innerText = text;

  document.getElementById("loader").style.display = "none";
};

</script>

</body>
</html>
