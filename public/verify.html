<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Nexora Verify</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      height:100vh;
      overflow:hidden;
      font-family:'Poppins',sans-serif;
      background:#02040f;
      display:flex;
      justify-content:center;
      align-items:center;
      position:relative;
    }

    /* Background glow */
    body::before{
      content:"";
      position:absolute;
      width:1200px;
      height:1200px;
      background:
      radial-gradient(circle, rgba(0,174,255,0.15) 0%, transparent 60%);
      animation:pulse 6s infinite ease-in-out;
    }

    body::after{
      content:"";
      position:absolute;
      inset:0;
      background:
      radial-gradient(circle at 20% 70%, rgba(170,0,255,0.25), transparent 25%),
      radial-gradient(circle at 80% 30%, rgba(0,140,255,0.25), transparent 25%);
      filter:blur(60px);
    }

    @keyframes pulse{
      0%{
        transform:scale(1);
      }

      50%{
        transform:scale(1.1);
      }

      100%{
        transform:scale(1);
      }
    }

    /* Cercles animés */
    .circle{
      position:absolute;
      border-radius:50%;
      border:1px solid rgba(255,255,255,0.08);
      animation:rotate 20s linear infinite;
    }

    .circle1{
      width:700px;
      height:700px;
    }

    .circle2{
      width:500px;
      height:500px;
      animation-direction:reverse;
    }

    @keyframes rotate{
      from{
        transform:rotate(0deg);
      }

      to{
        transform:rotate(360deg);
      }
    }

    /* Particules */
    .particles span{
      position:absolute;
      width:4px;
      height:4px;
      border-radius:50%;
      background:#8b5cf6;
      box-shadow:0 0 10px #8b5cf6;
      animation:float 10s linear infinite;
    }

    .particles span:nth-child(1){
      left:10%;
      animation-duration:7s;
    }

    .particles span:nth-child(2){
      left:30%;
      animation-duration:12s;
    }

    .particles span:nth-child(3){
      left:50%;
      animation-duration:8s;
    }

    .particles span:nth-child(4){
      left:70%;
      animation-duration:15s;
    }

    .particles span:nth-child(5){
      left:90%;
      animation-duration:9s;
    }

    @keyframes float{
      from{
        transform:translateY(100vh);
        opacity:0;
      }

      20%{
        opacity:1;
      }

      to{
        transform:translateY(-100vh);
        opacity:0;
      }
    }

    /* Carte */
    .verify-box{
      width:450px;
      padding:45px;
      border-radius:28px;
      background:rgba(7,10,25,0.65);
      backdrop-filter:blur(20px);
      border:1px solid rgba(255,255,255,0.08);
      text-align:center;
      position:relative;
      z-index:2;

      box-shadow:
      0 0 40px rgba(0,174,255,0.2),
      0 0 80px rgba(140,0,255,0.2);
    }

    /* Bordure animée */
    .verify-box::before{
      content:"";
      position:absolute;
      inset:-2px;
      border-radius:28px;
      padding:2px;
      background:linear-gradient(135deg,#00c3ff,#7b2cff,#00c3ff);

      -webkit-mask:
      linear-gradient(#fff 0 0) content-box,
      linear-gradient(#fff 0 0);

      -webkit-mask-composite:xor;
      mask-composite:exclude;

      animation:borderGlow 5s linear infinite;
    }

    @keyframes borderGlow{
      100%{
        filter:hue-rotate(360deg);
      }
    }

    h1{
      color:white;
      font-size:42px;
      margin-bottom:10px;
      font-weight:700;
      letter-spacing:1px;
    }

    .subtitle{
      font-size:20px;
      margin-bottom:35px;

      background:linear-gradient(90deg,#00c3ff,#c14dff);

      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;

      font-weight:500;
    }

    /* Bouton */
    .verify-btn{
      width:100%;
      padding:18px;
      border:none;
      border-radius:18px;

      font-size:18px;
      font-weight:600;

      cursor:pointer;

      color:white;

      background:linear-gradient(90deg,#7b2cff,#00c3ff);

      transition:0.3s;

      box-shadow:
      0 0 20px rgba(123,44,255,0.5),
      0 0 40px rgba(0,195,255,0.3);
    }

    .verify-btn:hover{
      transform:translateY(-3px) scale(1.03);

      box-shadow:
      0 0 30px rgba(123,44,255,0.7),
      0 0 60px rgba(0,195,255,0.5);
    }

    .verify-btn:disabled{
      opacity:0.8;
      cursor:not-allowed;
    }

    .success{
      margin-top:20px;
      color:#00ff99;
      opacity:0;
      transition:0.4s;
      font-size:15px;
    }

    .success.show{
      opacity:1;
    }

    /* Responsive */
    @media(max-width:600px){

      .verify-box{
        width:92%;
        padding:35px 25px;
      }

      h1{
        font-size:32px;
      }
    }

  </style>
</head>

<body>

  <!-- Cercles -->
  <div class="circle circle1"></div>
  <div class="circle circle2"></div>

  <!-- Particules -->
  <div class="particles">
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
  </div>

  <!-- Carte -->
  <div class="verify-box">

    <h1>NEXORA</h1>

    <p class="subtitle">
      Nexora verify
    </p>

    <button class="verify-btn" id="verifyBtn">
      Verify Identity
    </button>

    <div class="success" id="successMessage">
      ✔ Verification réussie
    </div>

  </div>

  <script>

    document.addEventListener("DOMContentLoaded", () => {

      const verifyBtn = document.getElementById("verifyBtn");
      const successMessage = document.getElementById("successMessage");

      verifyBtn.addEventListener("click", () => {

        /* Désactive le bouton */
        verifyBtn.disabled = true;

        /* Animation texte */
        verifyBtn.innerHTML = "Verification...";

        /* Effet loading */
        verifyBtn.style.opacity = "0.8";

        setTimeout(() => {

          /* Succès */
          verifyBtn.innerHTML = "Verified ✔";

          /* Couleur verte */
          verifyBtn.style.background =
          "linear-gradient(90deg,#00ff99,#00c3ff)";

          /* Message visible */
          successMessage.classList.add("show");

        }, 2000);

      });

    });

  </script>

</body>
</html>
